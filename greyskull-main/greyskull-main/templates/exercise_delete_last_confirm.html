{% extends 'base.html' %}

{% block content %}
  <div class="mb-3">
    <a href="{{ url_for('exercise_detail', exercise_id=exercise_id) }}" class="btn btn-sm btn-light">← Back</a>
  </div>

  <div class="card border-warning">
    <div class="card-body">
      <h3 class="card-title text-warning">Delete Last Session</h3>
      <p class="mb-3">Are you sure you want to delete the most recent session for <strong>{{ exercise.name }}</strong>?</p>
      <p class="text-muted small mb-4">Only the latest logged session will be removed.</p>

      <div class="d-flex gap-2">
        <form method="post" action="{{ url_for('web_delete_last', exercise_id=exercise_id) }}" class="flex-grow-1">
          <button class="btn btn-warning w-100" type="submit">Yes, remove last session</button>
        </form>
        <a href="{{ url_for('exercise_detail', exercise_id=exercise_id) }}" class="btn btn-secondary">Cancel</a>
      </div>
    </div>
  </div>

{% endblock %}
