<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f5e6d3">
  <title>Greyskull LP Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* CSS Variables */
    :root {
      --bg-primary: #f5f1eb;
      --bg-secondary: #e8dfd4;
      --card-bg: #faf8f5;
      --card-hover: #ffffff;
      --text-primary: #3d2f24;
      --text-secondary: #8b7355;
      --text-tertiary: #a89484;
      --border-color: #e0d5c7;
      --border-light: #ede6dc;
      --input-bg: #ffffff;
      --input-border: #d4c4b0;
      --shadow-sm: 0 1px 2px rgba(61, 47, 36, 0.06);
      --shadow: 0 4px 12px rgba(61, 47, 36, 0.1);
      --shadow-lg: 0 12px 32px rgba(61, 47, 36, 0.15);
      --primary: #d4793b;
      --primary-dark: #b8652f;
      --primary-light: #e69158;
      --accent: #c67c4a;
      --accent-dark: #a96838;
      --success: #9b7c5a;
      --danger: #c45c3e;
      --warning: #d89550;
      --info: #b8956f;
      --radius: 16px;
      --radius-sm: 12px;
      --radius-lg: 20px;
    }

    * {
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(135deg, #e8d4be 0%, #f5e6d3 50%, #faf8f5 100%);
      background-attachment: fixed;
      min-height: 100vh;
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      transition: background 0.2s ease;
      padding-bottom: 100px;
      padding-top: env(safe-area-inset-top);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      -webkit-overflow-scrolling: touch;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(61, 47, 36, 0.03) 2px, rgba(61, 47, 36, 0.03) 4px),
        repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(61, 47, 36, 0.03) 2px, rgba(61, 47, 36, 0.03) 4px);
      opacity: 0.5;
      pointer-events: none;
      z-index: 1;
    }

    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 30%, rgba(212, 121, 59, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(198, 124, 74, 0.06) 0%, transparent 50%);
      pointer-events: none;
      z-index: 1;
    }

    main.container {
      position: relative;
      z-index: 2;
    }

    /* Smooth transitions */
    .transition-all {
      transition: all 0.2s ease;
    }

    /* Container */
    main.container {
      max-width: 640px;
      padding: 16px 12px;
      margin-top: 12px;
    }

    /* Navbar */
    .navbar {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
      padding: 14px 0;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }

    .navbar-brand {
      color: var(--text-primary) !important;
      font-weight: 800;
      font-size: 1.4rem;
      letter-spacing: -0.8px;
    }

    /* Cards */
    .card-custom {
      background: var(--card-bg);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
      overflow: hidden;
    }

    .card-custom:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow);
    }

    .card-custom:active {
      transform: translateY(0) scale(0.99);
      box-shadow: var(--shadow-sm);
    }

    /* Page header */
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .page-title-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .page-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .page-title {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.6px;
      margin: 0;
      color: #2d1f17;
      text-shadow: 0 1px 3px rgba(212, 121, 59, 0.15);
      line-height: 1.2;
    }

    .page-subtitle {
      color: var(--text-secondary);
      font-weight: 500;
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .meta-text {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* Exercise cards */
    .exercise-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .exercise-card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 16px;
      border: 1px solid var(--border-light);
      box-shadow: 0 2px 8px rgba(61, 47, 36, 0.08), 0 1px 2px rgba(61, 47, 36, 0.05);
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      position: relative;
    }

    .exercise-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(212, 121, 59, 0.02) 10px, rgba(212, 121, 59, 0.02) 20px);
      border-radius: var(--radius-lg);
      pointer-events: none;
      opacity: 0.3;
    }

    .exercise-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(61, 47, 36, 0.12), 0 2px 4px rgba(61, 47, 36, 0.08);
      background: var(--card-hover);
      border-color: var(--border-color);
    }

    .exercise-card:active {
      transform: scale(0.98);
      transition: transform 0.1s ease;
    }

    .exercise-card__header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .exercise-card__title {
      font-size: 1.08rem;
      font-weight: 800;
      margin: 0 0 6px 0;
      color: var(--text-primary);
      letter-spacing: -0.2px;
      line-height: 1.3;
    }

    .exercise-card__meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .exercise-card__chevron {
      font-size: 1.2rem;
      color: var(--text-tertiary);
      padding-top: 2px;
      flex-shrink: 0;
    }

    .exercise-card__stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-light);
    }

    .stat-pill {
      background: rgba(212, 121, 59, 0.08);
      border: 1px solid rgba(212, 121, 59, 0.2);
      border-radius: var(--radius);
      padding: 12px 10px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .stat-pill::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(212, 121, 59, 0.03) 8px, rgba(212, 121, 59, 0.03) 16px);
      pointer-events: none;
    }

    .stat-pill--accent {
      background: linear-gradient(135deg, rgba(212, 121, 59, 0.12) 0%, rgba(212, 121, 59, 0.08) 100%);
      border-color: rgba(212, 121, 59, 0.25);
    }

    .stat-pill--success {
      background: linear-gradient(135deg, rgba(155, 124, 90, 0.12) 0%, rgba(155, 124, 90, 0.08) 100%);
      border-color: rgba(155, 124, 90, 0.25);
    }

    .stat-pill__label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-tertiary);
      font-weight: 800;
      margin-bottom: 4px;
    }

    .stat-pill__value {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 2px;
      line-height: 1.2;
    }

    .stat-pill__hint {
      font-size: 0.65rem;
      color: var(--text-tertiary);
      font-weight: 600;
    }

    .empty-callout {
      margin-top: 14px;
      padding: 12px;
      border-radius: var(--radius);
      text-align: center;
      font-weight: 600;
      background: linear-gradient(135deg, rgba(216, 149, 80, 0.15) 0%, rgba(216, 149, 80, 0.1) 100%);
      color: var(--text-primary);
      border: 1px solid rgba(216, 149, 80, 0.3);
    }

    .empty-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 60px 24px;
      text-align: center;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-light);
    }

    /* Section cards */
    .section-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 20px;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
    }

    .section-title {
      margin: 0 0 16px 0;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 20px;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
      text-align: center;
    }

    .stat-card__label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-tertiary);
      font-weight: 800;
      margin-bottom: 8px;
    }

    .stat-card__value {
      font-size: 2.3rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .stat-card__hint {
      font-size: 0.8rem;
      color: var(--text-tertiary);
    }

    .two-col-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .danger-card {
      border: 2px solid rgba(231, 76, 60, 0.25);
      background: rgba(231, 76, 60, 0.04);
    }

    /* Form inputs */
    .form-control, .form-select {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      border-radius: var(--radius);
      padding: 12px 14px;
      font-size: 16px;
      transition: all 0.2s ease;
      font-weight: 500;
    }

    .form-control:focus, .form-select:focus {
      background: var(--input-bg);
      border-color: var(--primary);
      color: var(--text-primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
      outline: none;
    }

    /* Buttons */
    .btn-primary {
      background: var(--primary);
      border: none;
      border-radius: var(--radius);
      padding: 13px 18px;
      font-weight: 600;
      box-shadow: var(--shadow-sm);
      font-size: 0.95rem;
      letter-spacing: 0.2px;
      min-height: 44px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
      box-shadow: var(--shadow);
    }

    .btn-primary:active {
      transform: scale(0.98);
      box-shadow: var(--shadow-sm);
    }

    .btn-success {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
      color: #faf8f5;
      border: none;
      border-radius: var(--radius);
      padding: 13px 18px;
      font-weight: 600;
      box-shadow: 0 3px 10px rgba(198, 124, 74, 0.3);
      font-size: 0.95rem;
      letter-spacing: 0.2px;
      min-height: 44px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    
    .btn-success:hover {
      background: linear-gradient(135deg, var(--accent-dark) 0%, #8f572b 100%);
      transform: translateY(-2px);
      box-shadow: 0 5px 14px rgba(198, 124, 74, 0.4);
      color: white;
    }
    
    .btn-success:active {
      transform: scale(0.98);
      box-shadow: 0 2px 6px rgba(198, 124, 74, 0.3);
    }

    .btn-outline-secondary {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      border-radius: 999px;
      padding: 8px 16px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .btn-outline-secondary:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Filter pills */
    .filter-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 0;
      margin-bottom: 16px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .filter-pills::-webkit-scrollbar {
      display: none;
    }

    .filter-pill {
      display: inline-flex;
      align-items: center;
      padding: 9px 16px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      background: rgba(61, 47, 36, 0.08);
      color: var(--text-primary);
      border: 1px solid rgba(61, 47, 36, 0.15);
      box-shadow: 0 2px 6px rgba(61, 47, 36, 0.08);
      transition: all 0.2s ease;
      min-height: 36px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .filter-pill:hover {
      background: rgba(61, 47, 36, 0.12);
      border-color: rgba(61, 47, 36, 0.2);
      transform: translateY(-1px);
      box-shadow: 0 3px 10px rgba(61, 47, 36, 0.12);
    }

    .filter-pill.active {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #faf8f5;
      border-color: var(--primary);
      box-shadow: 0 3px 10px rgba(212, 121, 59, 0.3);
      transform: translateY(0);
    }

    .filter-pill.active-blue {
      background: linear-gradient(135deg, #d4793b 0%, #b8652f 100%);
      color: #faf8f5;
      border-color: #d4793b;
    }

    .filter-pill.active-red {
      background: linear-gradient(135deg, #c45c3e 0%, #a84a2f 100%);
      color: #faf8f5;
      border-color: #c45c3e;
    }

    .filter-pill.active-gray {
      background: linear-gradient(135deg, #9b7c5a 0%, #7d6446 100%);
      color: #faf8f5;
      border-color: #9b7c5a;
    }

    /* Label badges */
    .label-badge {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: white;
      box-shadow: none;
    }

    .label-badge-a {
      background: linear-gradient(135deg, #d4793b 0%, #b8652f 100%);
      box-shadow: 0 2px 4px rgba(212, 121, 59, 0.25);
    }

    .label-badge-b {
      background: linear-gradient(135deg, #c45c3e 0%, #a84a2f 100%);
      box-shadow: 0 2px 4px rgba(196, 92, 62, 0.25);
    }

    .label-badge-add {
      background: linear-gradient(135deg, #9b7c5a 0%, #7d6446 100%);
      box-shadow: 0 2px 4px rgba(155, 124, 90, 0.25);
    }

    /* Alert */
    .alert {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      border-radius: 10px;
    }

    .alert-success {
      border-left: 4px solid var(--success);
    }

    .alert-danger {
      border-left: 4px solid var(--danger);
    }

    /* Floating Action Button */
    .fab {
      position: fixed;
      bottom: 28px;
      right: 28px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--primary);
      border: none;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 999;
      transition: all 0.2s ease;
      color: white;
    }

    .fab:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-lg);
    }

    .fab:active {
      transform: translateY(0);
      box-shadow: var(--shadow);
    }

    /* Modal Overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(61, 47, 36, 0.4);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { 
        opacity: 0;
        transform: translateY(20px);
      }
      to { 
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-content {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      max-width: 480px;
      width: calc(100% - 32px);
      padding: 24px 20px;
      box-shadow: var(--shadow-lg);
      animation: slideUp 0.25s ease;
      max-height: 90vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .modal-header h4 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0;
      letter-spacing: -0.3px;
    }

    .modal-close {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: var(--text-secondary);
      border-radius: 8px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close:hover {
      background: var(--bg-primary);
      color: var(--text-primary);
    }

    /* Loading states */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .loading {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    /* Prevent iOS zoom */
    @media (max-width: 768px) {
      input, select, textarea {
        font-size: 16px !important;
      }

      .page-header {
        align-items: flex-start;
      }

      .stat-grid {
        grid-template-columns: 1fr;
      }

      .two-col-grid {
        grid-template-columns: 1fr;
      }
    }

    /* iPhone 12 mini specific optimizations */
    @media (max-width: 380px) {
      main.container {
        padding: 16px 10px;
      }

      .page-title {
        font-size: 1.55rem;
      }

      .exercise-card {
        padding: 14px;
      }

      .exercise-card__title {
        font-size: 1.02rem;
      }

      .stat-pill__value {
        font-size: 1.25rem;
      }

      .filter-pill {
        padding: 8px 14px;
        font-size: 0.8rem;
      }

      .btn-success, .btn-primary {
        padding: 12px 16px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <!-- Main Content -->
  <main class="container">
    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
